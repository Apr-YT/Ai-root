[package]
name = "ai-root"
version = "1.0.0"
edition = "2021"
description = "AI-root —— 以 LocalSystem 运行的提权命令中继（命名管道 IPC + 共享令牌鉴权）"
default-run = "ai-root"

# 依赖说明（均为主流开源方案）：
# - windows-service : Windows 服务注册与控制框架 (https://crates.io/crates/windows-service)
# - windows-sys     : 轻量 Win32 API 绑定 (https://crates.io/crates/windows-sys)
# - serde/serde_json: 管道通信协议编解码
# - rand            : 生成随机共享令牌
# - chrono          : 执行日志时间戳
# - egui/eframe     : 原生 GUI 控制面板（即时模式，便于审计）—— gui feature 才编译
# - tray-icon       : 系统托盘常驻（状态角标 + 右键菜单）—— gui feature 才编译
[features]
# 默认带 GUI；服务端（--service / headless）用 --no-default-features 构建，
# 使 SYSTEM 常驻进程不携带 egui/tray 渲染依赖（体积小、静态指纹干净）
default = ["gui"]
gui = ["dep:egui", "dep:eframe", "dep:tray-icon"]

[dependencies]
windows-service = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = "0.4"
egui = { version = "0.30", optional = true }
eframe = { version = "0.30", optional = true }
tray-icon = { version = "0.19", optional = true }

[profile.release]
opt-level = 2
lto = false
codegen-units = 4
