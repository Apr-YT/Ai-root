[package]
name = "AI-Root"
version = "1.0.0"
edition = "2021"
description = "AI-Root —— 以 LocalSystem 运行的提权命令中继（命名管道 IPC + 共享令牌鉴权）"
default-run = "AI-Root"

# 依赖说明（均为主流开源方案）：
# - windows-service : Windows 服务注册与控制框架 (https://crates.io/crates/windows-service)
# - windows-sys     : 轻量 Win32 API 绑定 (https://crates.io/crates/windows-sys)
# - serde/serde_json: 管道通信协议编解码
# - rand            : 生成随机共享令牌
# - chrono          : 执行日志时间戳
# 本项目为纯终端/服务形态（无 GUI 依赖）。

[dependencies]
windows-service = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = "0.4"

[build-dependencies]
# 嵌入 Windows 资源（应用图标 assets/AI-Root.ico），仅 Windows 目标生效
embed-resource = "2"

[profile.release]
opt-level = 3
# thin LTO：在「构建时间」与「跨 crate 内联/死代码消除」之间取平衡。
# 单文件终端工具无需 full LTO 的极致体积（会显著拉长 CI 构建），thin 已能消除
# serde_json/chrono 与本 crate 之间的大部分跨 crate 调用开销。
lto = "thin"
codegen-units = 1
# 剥离符号：`debuginfo` 保留符号表、只去掉 .debug_* 段。
#
# 为什么不用 `strip = "symbols"`（2026-10-04 实测）：
#   实测对比（rustc -O，同源码）：
#     strip="symbols"   → 871KB，panic 回溯**完全为空**，只剩一行
#                         "note: Some details are omitted"，一个帧都没有。
#     strip="debuginfo" → 1.22MB（+30%），回溯完整给出函数名与调用链
#                         （rust_begin_unwind → panic_fmt → panic →
#                           unwrap_failed → 目标函数），且 panic 位置
#                           仍精确到 file:line:col（该信息编在 panic 元数据中，
#                           不依赖 .debug_* 段）。
#     strip="none"      → 3.58MB（+315%），多出的体积几乎全是无用的 debug 段。
#
#   本项目是以 LocalSystem 执行任意命令的服务，线上崩溃时若拿不到任何符号，
#   排障成本远高于 256KB 的体积收益。故取 `debuginfo` 这个中间点。
strip = "debuginfo"
