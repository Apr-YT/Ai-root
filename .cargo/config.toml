# Cargo 构建配置 —— 单一事实来源
#
# 设计意图（2026-10-04 重构）：
#   此前 target-dir / 链接器 / 路径重映射分散在 build.sh、build.ps1 两个脚本里各写一遍，
#   逻辑必须手工同步，已因此产生真实缺陷（build.ps1 漏导出 CARGO_HOME，导致两脚本
#   用了不同的 crate registry 源，产物字节不一致）。
#
#   现将**与机器无关的稳定配置**全部下沉到本文件；脚本只负责"找出本机 binutils 在
#   哪、把它交给 cargo"这一件真正与机器相关的事。
#
# 前置（为什么现在能这么干净）：
#   仓库须置于纯 ASCII 路径下（例如 D:\src\AI-Root）。
#   若路径含中文（如「工具」），MinGW 的 ld/dlltool 会按 ANSI 代码页解释路径，导致
#   "cannot find ...\工具\...\libsyn-xxx.rlib"（文件存在却找不到），
#   因而被迫引入外部 CARGO_TARGET_DIR + ASCII 校验等一整套绕行机制。路径 ASCII 化后
#   这些机制全部不再需要 —— 直接用仓库内默认的 target/ 即可。

[build]
# 本机与 CI 的产物必须分离（CI 上传工件时不应混入本地产物）。
# 通过环境变量 CARGO_TARGET_DIR 可在不改本文件的前提下覆盖。
target-dir = "target"

# 只构建/测试这两个平台时用显式 --target 指定；此处不设默认 target，
# 保持 `cargo build`（host 平台）与 `cargo build --target ...` 行为一致。

[target.x86_64-pc-windows-gnu]
# gnu 目标的链接器与工具链由 PATH 中注入的完整 MinGW binutils 提供。
# 不在此处硬编码 linker 路径 —— 因为 binutils 位置是本机相关的
# （不同机器上可能在 msys64\mingw64、mingw-w64 或系统 PATH 的不同位置），
# 硬编码会再次引入"路径漂移即构建失败"的脆弱性。由脚本探测并注入 PATH。
#
# 说明：rustup 自带的 self-contained 目录缺 as.exe，无法独立完成链接，
# 故必须使用外部完整 binutils（见 build.sh / build.ps1 的探测逻辑）。
rustflags = []

[target.x86_64-pc-windows-msvc]
# msvc 目标由 rustup 自带链完成，无需外部 binutils。
# CI 的 build-msvc job 即走此路径。
rustflags = []

# 说明：不在此处设置 --remap-path-prefix。
# 曾试图用它将 CARGO_HOME 下的 registry 绝对路径从产物中抹除（减小体积、提升可复现性），
# 但实测 rustc 的 remap 匹配**区分盘符大小写**（小写 d:/ 不匹配大写 D:/），
# 行为不稳定且收益有限。真正的可复现性瓶颈是 dlltool（见 README）。
